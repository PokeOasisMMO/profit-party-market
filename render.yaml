services:
  - type: web
    name: profit-party-market
    runtime: docker
    dockerfilePath: ./Dockerfile.hosted
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUGGESTION_ONLY
        value: "true"
      - key: GATEWAY_HOST
        value: 0.0.0.0
      - key: DATABENTO_ENABLED
        value: "true"
      - key: DATABENTO_DATASET
        value: GLBX.MDP3
      - key: DATABENTO_SYMBOL
        value: NQ.v.0
      - key: DATABENTO_STYPE
        value: continuous
      - key: ALPACA_FEED
        value: iex
      - key: TOPSTEP_MARKET_LIVE
        value: "false"
      - key: TOPSTEP_CONTRACT_SEARCH
        value: NQ
      - key: TOPSTEP_HISTORY_MINUTES
        value: "20"
      - key: DISCORD_GUILD_ID
        value: "1415914999926358068"
      - key: DISCORD_VIP_ROLE_ID
        value: "1416508522920804433"
      - key: DISCORD_SITE_URL
        value: https://profitparty.online
      - key: ALLOWED_ORIGINS
        value: https://profitparty.online,https://www.profitparty.online,https://profit-party.shady0324.chatgpt.site
      - key: DATABENTO_API_KEY
        sync: false
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: TOPSTEP_USERNAME
        sync: false
      - key: TOPSTEP_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
